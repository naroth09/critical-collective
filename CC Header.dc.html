<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/classical-85097e53-3f2f-43c8-9e34-7bd733347a16/styles.css">
<script src="_ds/classical-85097e53-3f2f-43c8-9e34-7bd733347a16/_ds_bundle.js"></script>
<style>
  :root {
    --color-bg: #efe8dd;            /* warm beige ground, between MIST and EARTH */
    --color-surface: #e5dbcc;       /* deeper beige — section alternates, hovers */
    --color-text: #000000;          /* BLACK  — body, headings, rules */
    --color-divider: #cdc3b3;       /* STONE, warmed — borders and hairlines */
    --color-accent: #b8962e;        /* EDITORIAL GOLD — labels, active states */
    --color-accent-100: #f4eeda;
    --color-accent-300: #ddc584;
    --color-accent-600: #a38321;
    --color-accent-700: #715a14;
    --color-accent-800: #56440f;
    --color-neutral-900: #14120f;
  }
  .btn-primary, .btn-secondary, .btn-ghost { color: var(--color-accent-800); }
  .tag-outline, .tag-accent, .tag-accent-2 { color: var(--color-accent-800); }
  .card-kicker { color: var(--color-accent-800); }
  .btn-primary:hover, .btn-secondary:hover, .btn-ghost:hover { color: var(--color-accent-800); }
  a { color: var(--color-accent-700); text-decoration: none; }
  a:hover { color: var(--color-accent); }
  :root { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --color-bg: #14120f;
    --color-surface: #1d1a15;
    --color-text: #f0ebe0;
    --color-divider: #38312a;
    --color-accent: #cfa63f;
    --color-accent-100: #2b2317;
    --color-accent-300: #e3c98d;
    --color-accent-600: #dcb658;
    --color-accent-700: #dfbc6a;
    --color-accent-800: #ecd191;
    --color-neutral-100: #1d1a15;
    --color-neutral-200: #241f19;
    --color-neutral-300: #2e2823;
    --color-neutral-900: #f0ebe0;
  }
  :root[data-theme="dark"] .plate { background: #241f19; }
  :root[data-theme="dark"] img { --cc-img-dim: 1; }
  html { transition: background-color 240ms ease; }
  @keyframes ccMenuIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</helmet>

<div style="font-family: var(--font-body); color: var(--color-text); {{ overlayVars }}">
  <header style="position: relative; z-index: 50; transition: background 260ms ease, backdrop-filter 260ms ease, border-color 260ms ease; background: {{ headerBg }}; backdrop-filter: {{ headerBackdrop }}; border-bottom: 1px solid {{ headerBorder }};">
    <div style="max-width: 1180px; margin: 0 auto; padding: 14px 32px; min-height: 86px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 20px;">
      <nav style="display: flex; align-items: center; flex-wrap: nowrap; gap: 18px; justify-self: start; overflow: hidden; min-width: 0;">
        <sc-for list="{{ links }}" as="link" hint-placeholder-count="4">
          <sc-if value="{{ link.isActive }}" hint-placeholder-val="{{ false }}">
            <a href="{{ link.href }}" style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; font-family: var(--font-ui); color: var(--color-text); padding: 6px 0; border-bottom: 2px solid var(--color-accent); white-space: nowrap;">{{ link.label }}</a>
          </sc-if>
          <sc-if value="{{ link.isOther }}" hint-placeholder-val="{{ true }}">
            <a href="{{ link.href }}" style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; font-family: var(--font-ui); color: color-mix(in srgb, var(--color-text) 62%, transparent); padding: 6px 0; white-space: nowrap; transition: color 180ms ease;" style-hover="color: var(--color-text);">{{ link.label }}</a>
          </sc-if>
        </sc-for>
      </nav>
      <div style="justify-self: center;">
        <sc-if value="{{ logoNormal }}" hint-placeholder-val="{{ true }}">
          <a href="Critical%20Collective%20Home.dc.html" style="display: block;"><img src="assets/cc-logo.png" alt="Critical Collective" style="height: 40px; width: auto; display: block;"></a>
        </sc-if>
        <sc-if value="{{ logoCream }}" hint-placeholder-val="{{ false }}">
          <a href="Critical%20Collective%20Home.dc.html" style="display: block;"><img src="assets/cc-logo-cream.png" alt="Critical Collective" style="height: 40px; width: auto; display: block;"></a>
        </sc-if>
      </div>
      <div style="justify-self: end; display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 14px; min-width: 0;">
        <a href="Critical%20Collective%20Newsletters.dc.html" style="font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 62%, transparent); white-space: nowrap;" style-hover="color: var(--color-text);">Newsletters</a>
        <a href="Critical%20Collective%20Search.dc.html" aria-label="Search the archive" title="Search the archive" style="width: 32px; height: 32px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border: 1px solid var(--color-divider); border-radius: 999px; color: color-mix(in srgb, var(--color-text) 70%, transparent);" style-hover="color: var(--color-accent-700); border-color: var(--color-accent);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        </a>
        <button type="button" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}" style="width: 32px; height: 32px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border: 1px solid var(--color-divider); border-radius: 999px; background: transparent; color: color-mix(in srgb, var(--color-text) 70%, transparent); cursor: pointer; transition: color 160ms ease, border-color 160ms ease;" style-hover="color: var(--color-accent-700); border-color: var(--color-accent);">
          <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
          </sc-if>
          <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          </sc-if>
        </button>
        <div data-cc-account="1" style="position: relative;">
          <button type="button" onClick="{{ toggleAccount }}" aria-haspopup="true" aria-expanded="{{ accountExpanded }}" style="display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-ui); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-accent-700); border: 1px solid var(--color-accent); border-radius: var(--radius-md); background: transparent; padding: 8px 14px; white-space: nowrap; cursor: pointer; transition: background 160ms ease, color 160ms ease;" style-hover="background: var(--color-accent-100); color: var(--color-accent-800);">Sign in<span style="font-size: 9px; opacity: 0.6;">▾</span></button>
          <sc-if value="{{ accountOpen }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; top: 100%; right: 0; padding-top: 8px; min-width: 226px; z-index: 60; animation: ccMenuIn 0.2s ease both; transform-origin: top right;">
              <div style="background: color-mix(in srgb, var(--color-bg) 88%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--color-divider); border-top: 2px solid var(--color-accent); border-radius: 0 0 var(--radius-md) var(--radius-md); box-shadow: var(--shadow-md); padding: 8px;">
                <a href="Critical%20Collective%20Sign%20In.dc.html" style="display: block; font-size: 13px; color: var(--color-text); padding: 9px 12px; border-radius: var(--radius-sm);" style-hover="background: var(--color-surface); color: var(--color-accent-800);">Sign in to your account</a>
                <a href="Critical%20Collective%20Sign%20In.dc.html#plans" style="display: block; font-size: 13px; color: var(--color-text); padding: 9px 12px; border-radius: var(--radius-sm);" style-hover="background: var(--color-surface); color: var(--color-accent-800);">Subscribe</a>
              </div>
            </div>
          </sc-if>
        </div>
      </div>
    </div>
  </header>

  <sc-if value="{{ showCategoryBar }}" hint-placeholder-val="{{ true }}">
  <div style="border-bottom: 1px solid var(--color-divider); background: color-mix(in srgb, var(--color-surface) 42%, transparent); backdrop-filter: blur(8px); position: relative; z-index: 30;">
    <div style="max-width: 1180px; margin: 0 auto; padding: 0 32px; display: flex; align-items: stretch;">
      <div style="display: flex; align-items: stretch; flex-wrap: wrap; min-width: 0; flex: 1 1 auto; justify-content: center;">
        <sc-for list="{{ cats }}" as="cat" hint-placeholder-count="5">
          <div style="position: relative;" onMouseEnter="{{ cat.open }}" onMouseLeave="{{ closeMenu }}">
            <a href="{{ cat.href }}" style="min-height: 52px; display: inline-flex; align-items: center; gap: 7px; padding: 0 13px; font-size: 12.5px; color: var(--color-text); border-bottom: 2px solid transparent; white-space: nowrap; transition: border-color 200ms ease;" style-hover="border-bottom-color: var(--color-accent);">{{ cat.name }}<span style="font-size: 9px; opacity: 0.5; display: inline-block; transition: transform 220ms ease; transform: {{ cat.arrow }};">▾</span></a>
            <sc-if value="{{ cat.isOpen }}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; top: 100%; left: 0; min-width: 252px; background: color-mix(in srgb, var(--color-bg) 88%, transparent); backdrop-filter: blur(8px); border: 1px solid var(--color-divider); border-top: 2px solid var(--color-accent); border-radius: 0 0 var(--radius-md) var(--radius-md); box-shadow: var(--shadow-md); padding: 8px; z-index: 50; animation: ccMenuIn 0.2s ease both; transform-origin: top left;">
                <sc-for list="{{ cat.items }}" as="item" hint-placeholder-count="4">
                  <a href="{{ item.href }}" style="display: block; font-size: 13.5px; color: var(--color-text); padding: 9px 13px; border-radius: var(--radius-sm);" style-hover="background: var(--color-surface); color: var(--color-accent-800);">{{ item.label }}</a>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;artists&quot;,&quot;authors&quot;,&quot;categories&quot;,&quot;newsletters&quot;,&quot;reference&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;overlay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: null, dark: false, account: false, scrolled: false };
  componentDidMount() {
    let dark = false;
    try {
      const saved = localStorage.getItem('cc-theme');
      dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) {}
    this.applyTheme(dark);
    this.onScroll = () => {
      if (this.props.overlay !== true) return;
      const y = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
      const s = y > 400;
      if (s !== this.state.scrolled) this.setState({ scrolled: s });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    document.addEventListener('scroll', this.onScroll, { passive: true, capture: true });
    this.onScroll();
    this.onDocClick = (e) => {
      if (!this.state.account) return;
      if (e.target && e.target.closest && e.target.closest('[data-cc-account]')) return;
      this.setState({ account: false });
    };
    this.onKey = (e) => { if (e.key === 'Escape' && this.state.account) this.setState({ account: false }); };
    document.addEventListener('click', this.onDocClick);
    document.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() {
    document.removeEventListener('click', this.onDocClick);
    document.removeEventListener('keydown', this.onKey);
    window.removeEventListener('scroll', this.onScroll);
    document.removeEventListener('scroll', this.onScroll, true);
  }
  applyTheme(dark) {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    try { localStorage.setItem('cc-theme', dark ? 'dark' : 'light'); } catch (e) {}
    this.setState({ dark });
  }
  renderVals() {
    const active = this.props.active ?? "";
    const overlay = this.props.overlay === true;
    const transparent = overlay && !this.state.scrolled;
    const headerBg = transparent ? "linear-gradient(180deg, rgba(10,9,7,0.46), rgba(10,9,7,0))" : "color-mix(in srgb, var(--color-bg) 92%, transparent)";
    const headerBackdrop = transparent ? "none" : "blur(8px)";
    const headerBorder = transparent ? "transparent" : "var(--color-divider)";
    const overlayVars = transparent ? "--color-text: #f4f2ec; --color-divider: rgba(244,242,236,0.34); --color-accent: #e3c98d; --color-accent-700: #f0e6c8; --color-accent-800: #f6eeda;" : "";
    const showCategoryBar = !transparent;
    const logoCream = this.state.dark === true || transparent;
    const links = [
      { label: "Artists", href: "Critical%20Collective%20Artists.dc.html", key: "artists" },
      { label: "Authors", href: "Critical%20Collective%20Authors.dc.html", key: "authors" },
      { label: "Reference & Archives", href: "Critical%20Collective%20Reference.dc.html", key: "reference" }
    ];
    const HREF = {"Modern & Contemporary Art":"Critical%20Collective%20Category.dc.html","Art History & Museums":"Critical%20Collective%20Category%20Art%20History.dc.html","Cinema & Photography":"Critical%20Collective%20Category%20Cinema.dc.html","Art, Design & Architecture":"Critical%20Collective%20Category%20Design.dc.html","Culture":"Critical%20Collective%20Category%20Culture.dc.html"};
    const ITEM_HREF = {"Art History":"Critical%20Collective%20Art%20History.dc.html"};
    const data = [
      { name: "Modern & Contemporary Art", items: ["Exhibitions", "Artist Profiles & Essays", "Artist Conversations", "Groups & Collectives", "Curators", "Curating South Asia"] },
      { name: "Art History & Museums", items: ["Art History", "Aesthetic Theory", "Museums", "CC Icons"] },
      { name: "Cinema & Photography", items: ["Cinema & OTT", "Lens-Based Practices"] },
      { name: "Art, Design & Architecture", items: ["Craft & Textile", "Design", "Architecture"] },
      { name: "Culture", items: ["Gender", "Food Cultures", "Art, Media & Law"] }
    ];
    return {
      headerBg, headerBackdrop, headerBorder, overlayVars, showCategoryBar,
      logoCream, logoNormal: !logoCream,
      isDark: this.state.dark === true,
      isLight: this.state.dark !== true,
      themeLabel: this.state.dark ? "Switch to light mode" : "Switch to dark mode",
      toggleTheme: () => this.applyTheme(!this.state.dark),
      links: links.map(l => ({ ...l, isActive: l.key === active, isOther: l.key !== active })),
      closeMenu: () => this.setState({ open: null }),
      accountOpen: this.state.account === true,
      accountExpanded: this.state.account === true ? "true" : "false",
      toggleAccount: (e) => { e.preventDefault(); e.stopPropagation(); this.setState(st => ({ account: !st.account })); },
      cats: data.map((c, i) => ({
        name: c.name,
        items: c.items.map(it => ({ label: it, href: ITEM_HREF[it] || HREF[c.name] })),
        href: HREF[c.name],
        isOpen: this.state.open === i,
        arrow: this.state.open === i ? "rotate(180deg)" : "rotate(0deg)",
        open: () => this.setState({ open: i })
      }))
    };
  }
}
</script>
</body>
</html>
