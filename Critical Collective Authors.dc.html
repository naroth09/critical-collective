<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/classical-85097e53-3f2f-43c8-9e34-7bd733347a16/styles.css">
<script src="_ds/classical-85097e53-3f2f-43c8-9e34-7bd733347a16/_ds_bundle.js"></script>
<style>
  :root {
    --color-bg: #efe8dd;
    --color-surface: #e5dbcc;
    --color-text: #000000;
    --color-divider: #cdc3b3;
    --color-accent: #b8962e;
    --color-accent-100: #f4eeda;
    --color-accent-300: #ddc584;
    --color-accent-600: #a38321;
    --color-accent-700: #715a14;
    --color-accent-800: #56440f;
    --color-neutral-900: #14120f;
  }
  body { margin: 0; background: var(--color-bg); }
  a { color: var(--color-accent-700); text-decoration: none; }
  a:hover { color: var(--color-accent); }
  ::selection { background: var(--color-accent-100); }
</style>
</helmet>

<template id="__bundler_thumbnail" data-bg-color="#f3f2f2">
  <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <rect width="400" height="300" fill="#f3f2f2"></rect>
    <text x="200" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="76" fill="#201f1d">CC</text>
    <rect x="120" y="182" width="160" height="2" fill="#b68235"></rect>
  </svg>
</template>

<div style="background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); min-height: 100vh;">

  <div style="position: sticky; top: 0; z-index: 40;"><dc-import name="CC Header" active="authors" hint-size="100%,132px"></dc-import></div>

  <main style="max-width: 1180px; margin: 0 auto; padding: 0 32px;">

    <div style="padding: 52px 0 18px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 60px; align-items: end;">
      <div>
        <p style="margin: 0 0 18px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent-700);">The archive</p>
        <h1 style="margin: 0; font-size: 54px; line-height: 1.02; letter-spacing: -0.02em;">Authors</h1>
      </div>
      <p style="margin: 0; font-size: 15px; line-height: 1.66; color: color-mix(in srgb, var(--color-text) 76%, transparent); text-wrap: pretty;">The critics, historians, curators and artists who write here. Select a name for their biography and a bibliography of everything they have published on Critical Collective.</p>
    </div>

    <div style="border-top: 1px solid var(--color-text); margin-top: 30px; padding: 22px 0 20px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap;">
      <label for="author-filter" style="font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--color-accent-700); flex: 0 0 auto;">Filter by name</label>
      <input id="author-filter" class="input" type="search" placeholder="Begin typing a name" value="{{ query }}" onInput="{{ onQuery }}" style="flex: 1 1 320px; min-width: 260px; font-size: 17px; padding: 12px 0; border: 0; border-bottom: 1px solid var(--color-divider); border-radius: 0; background: transparent;" style-focus="border-bottom-color: var(--color-accent); outline: none;">
      <span style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-feature-settings: 'tnum'; color: color-mix(in srgb, var(--color-text) 48%, transparent); flex: 0 0 auto;">{{ countLabel }}</span>
    </div>

    <section style="margin-top: 30px;">
      <div style="border-top: 1px solid var(--color-divider); padding-top: 26px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 34px; row-gap: 13px;">
        <sc-for list="{{ names }}" as="name" hint-placeholder-count="40">
          <sc-if value="{{ name.isLive }}" hint-placeholder-val="{{ false }}">
            <a href="Critical%20Collective%20Author.dc.html" style="display: inline-flex; align-items: baseline; gap: 9px; font-size: 15.5px; line-height: 1.35; color: var(--color-text); font-weight: 500;" style-hover="color: var(--color-accent-800);"><span style="border-bottom: 1px solid var(--color-accent);">{{ name.label }}</span><span style="flex: 0 0 auto; width: 5px; height: 5px; border-radius: 50%; background: var(--color-accent); transform: translateY(-3px);"></span></a>
          </sc-if>
          <sc-if value="{{ name.isPlain }}" hint-placeholder-val="{{ true }}">
            <a href="Critical%20Collective%20Author.dc.html" style="font-size: 14.5px; line-height: 1.35; color: color-mix(in srgb, var(--color-text) 72%, transparent);" style-hover="color: var(--color-accent-800);">{{ name.label }}</a>
          </sc-if>
        </sc-for>
      </div>
      <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
        <div style="padding: 60px 0; border-top: 1px solid var(--color-divider); text-align: center;">
          <p style="margin: 0 0 6px; font-family: var(--font-heading); font-size: 24px;">No authors found</p>
          <p style="margin: 0; font-size: 14px; color: color-mix(in srgb, var(--color-text) 62%, transparent);">Try another spelling.</p>
        </div>
      </sc-if>
    </section>

    <div style="height: 96px;"></div>

  </main>

  <dc-import name="CC Footer" hint-size="100%,220px"></dc-import>

</div>

</x-dc>

class Component extends DCLogic {
  state = { query: "" };
  renderVals() {
    const q = this.state.query.trim().toLowerCase();
    const filtered = q ? NAMES.filter(n => n.toLowerCase().includes(q)) : NAMES;
    return {
      query: this.state.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      names: filtered.map(n => ({
        label: n,
        isLive: n === "Gayatri Sinha",
        isPlain: n !== "Gayatri Sinha"
      })),
      noResults: filtered.length === 0,
      countLabel: filtered.length + (filtered.length === 1 ? " author" : " authors") + " in the archive"
    };
  }
}
</script>
</body>
</html>
